[project]
# TIP: Change it to the name of your repository
name = "python-template"

# TIP: Fill all the fields below
description = "Your project description here."
readme = "README.md"

authors = [{ name = "Your Name", email = "you@example.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = []

license = "MIT"
license-files = ["LICENSE"]

dynamic = ["version"]

# ===================
# Requirements (Deps)
# ===================
# TIP: Narrow Python version if it would fit your environment better
requires-python = ">=3.10,<4.0"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit~=4.0",
    "pyrefly~=1.0",
    "pyright>=1.1,<1.2",
    "ruff>=0.15,<1.0",
]

tests = [
    "pytest~=9.0",
    "tox~=4.0",
    "tox-uv>=1.35,<2.0",
]

# =============
# Project Links
# =============
# TIP: Fill in the project links
[project.urls]
Repository = "https://github.com/soucelover/python_template.git"
Issues = "https://github.com/soucelover/python_template/issues"
Changelog = "https://github.com/soucelover/python_template/releases"

# ============
# Build System
# ============
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.hatch.build.targets.sdist]
include = ["src/server", "pyproject.toml", "uv.lock", "README.md"]

[tool.hatch.version]
source = "vcs"

# =============
# Ruff Settings
# =============
[tool.ruff]
line-length = 78

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = ["ALL"]
ignore = [
    "D",      # TIP: Uncomment if you intend to write documentation from the start
    "ARG",    # flake8-unused-arguments (sometimes useful for refactoring)
    "RUF001",
    "RUF002",
    "RUF003",
    "TD003",  # Inserting Link issues
    "FIX",    # Consider resolving issue -- usually very annoying
    "COM812", # Redundant with formatter
]
extend-safe-fixes = ["TC", "PYI021"]
future-annotations = true

[tool.ruff.lint.per-file-ignores]
"!src/**" = ["D", "SLF"]
"tests/**/*" = ["S101", "INP001", "PLR2004"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = ["invoke.tasks.task"]

# ================
# Pyright Settings
# ================
[tool.pyright]
typeCheckingMode = "strict" # Change to standard if it's too tight for ya

reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUnnecessaryCast = "warning"

# ================
# Pyrefly Settings
# ================
[tool.pyrefly]
infer-with-first-use = false

[tool.pyrefly.errors]
redundant-cast = "warn"

# ===============
# Pytest Settings
# ===============
[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]

addopts = [
    # "--showlocals",                       # Show local variables for failed tests
    "-r a",                                 # Summary for tests at the end
    "--strict-markers",                     # Raise errors for misused markers
    "--import-mode=importlib",              # Rich import mode avoiding name conflicts
    "--color=yes",
]
